# User overrides - not managed by Omarchy.
# Sourced from ~/.config/ghostty/config via `config-file`.
# Values here win over earlier definitions in the main config.

# Mouse wheel: 5 lines per notch (discrete). Touchpad kept at default precision.
mouse-scroll-multiplier = precision:1,discrete:5

# Burst-scroll keybinds (vim direction). Wheel events can't be bound in Ghostty,
# so these are the practical substitute for "scroll a chunk fast".
keybind = super+j=scroll_page_lines:20
keybind = super+k=scroll_page_lines:-20
keybind = super+shift+j=scroll_page_lines:60
keybind = super+shift+k=scroll_page_lines:-60
