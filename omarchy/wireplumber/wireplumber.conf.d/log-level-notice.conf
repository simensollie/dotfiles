## Show WirePlumber notices in the journal (default is warnings only).
##
## 2026-11-02: the local autoswitch-bluetooth-profile.lua override logs the
## headset settle delay at notice level, so this is what makes
## `journalctl --user -u wireplumber | grep -i settle` work. Levels: 2 = W,
## 3 = N, 4 = I.
context.properties = {
  log.level = 3
}
