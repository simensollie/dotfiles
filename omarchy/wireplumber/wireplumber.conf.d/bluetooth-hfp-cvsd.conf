## Force CVSD (narrowband) for the HFP call link instead of mSBC.
##
## 2026-10-29: the Jabra EVOLVE 65 call link (HFP/SCO over the on-board Intel
## 8087:0036 controller) died several times per meeting with mSBC negotiated
## ("Failure in Bluetooth audio transport .../fd58", kernel "SCO packet for
## unknown connection handle"), and the far end heard crackling. mSBC rides
## USB isochronous alt setting 6 ("transparent") on Intel controllers, the
## least robust SCO path; CVSD uses the plain path. Quality drops to 8 kHz
## voice, but a link that stays up beats a wideband one that does not.
## Remove this file to get mSBC back once the link is proven stable.

monitor.bluez.properties = {
  bluez5.enable-msbc = false
}
